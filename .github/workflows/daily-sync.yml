name: Daily Data Sync

on:
  schedule:
    # 毎日00:00（JST）= 15:00（UTC）に実行
    - cron: '0 15 * * *'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      reason:
        description: '手動実行の理由（オプション）'
        required: false
        default: '手動同期'
      monthly_sheet:
        description: '月次実績シート名（例: 12月実績）'
        required: false
        default: ''

# GitHub Actionsがリポジトリにpushできるようにする
permissions:
  contents: write

jobs:
  data-sync-and-deploy:
    name: データ同期＆デプロイ
    runs-on: ubuntu-latest

    steps:
      # Step 1: リポジトリをチェックアウト
      - name: チェックアウト
        uses: actions/checkout@v4

      # Step 2: Node.jsのセットアップ
      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: 依存関係をインストール
      #   react-window@1.8.10がReact19を正式サポート外のためnpm ciがERESOLVEで失敗する（2026-07-10〜）。
      #   ローカルの依存関係解決に合わせて--legacy-peer-depsを指定。
      - name: 依存関係インストール
        run: |
          npm ci --legacy-peer-deps
          npm install firebase-admin

      # Step 4: GCP認証情報を設定
      - name: GCP認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: サービスアカウントキーをファイルに保存
      - name: サービスアカウントキーを保存
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > service-account-key.json

      # Step 6: スプレッドシートからベースデータをインポート
      - name: スプレッドシートデータ取得
        run: |
          if [ -n "${{ github.event.inputs.monthly_sheet }}" ]; then
            node importSpreadsheetData.cjs --monthly-sheet="${{ github.event.inputs.monthly_sheet }}"
          else
            node importSpreadsheetData.cjs
          fi

      # Step 7: .envファイルを作成（kintone APIトークン）
      - name: kintone環境変数設定
        run: |
          cat << EOF > .env
          KINTONE_SUBDOMAIN=acgaozora
          KINTONE_API_TOKEN_184=${{ secrets.KINTONE_API_TOKEN_184 }}
          KINTONE_API_TOKEN_197=${{ secrets.KINTONE_API_TOKEN_197 }}
          EOF

      # Step 8: kintoneからデータをインポート
      #   失敗してもパイプラインは止めず（良いデータ=184はデプロイする）、
      #   後続の「Kintone同期の失敗を検知」ステップでジョブを失敗扱いにして通知する。
      - name: kintoneデータ取得
        id: kintone
        continue-on-error: true
        run: node importFromKintone.cjs

      # Note: サービスチェックシートは月次運用のため、別ワークフロー(monthly-service-check.yml)で実行
      # 既存のselectedEquipment（介護保険レンタル）データは保持される

      # Step 9: Firestore clientEdits へ clientName・kintoneレコードを一括同期
      - name: Firestore clientEdits 同期
        run: node syncClientsToFirestore.cjs

      # Step 9.5: 変更情報をスプレッドシートへ自動同期（Kintone取込分も反映）
      #   デプロイ済み Cloud Function を呼ぶだけ（アプリのボタンと同じ追記専用処理）。失敗してもパイプラインは継続。
      - name: 変更情報スプレッドシート同期
        run: node triggerChangeRecordsSync.cjs

      # Step 9.6: 議事録一覧をスプレッドシートへ自動同期
      #   デプロイ済み Cloud Function `syncMeetingsToSheets` を呼ぶ（追記専用・meeting.id重複スキップ）。失敗してもパイプラインは継続。
      - name: 議事録スプレッドシート同期
        run: node triggerMeetingsSync.cjs

      # Step 10: アプリケーションをビルド
      - name: アプリケーションビルド
        run: npm run build

      # Step 11: Firebase Hostingにデプロイ
      - name: Firebase Hostingデプロイ
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project=welfare-assist-pro --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json

      # Step 12: ドキュメントの利用者件数を自動更新
      - name: ドキュメントの利用者件数を更新
        run: |
          TOTAL=$(node -e "console.log(require('./clients.json').length)")
          FORMATTED=$(printf "%'d" $TOTAL)
          sed -i "s/[0-9,]*件の利用者/${FORMATTED}件の利用者/g" README.md
          sed -i "s/[0-9,]*件の利用者/${FORMATTED}件の利用者/g" CLAUDE.md

      # Step 13: clients.jsonとドキュメントをGitにコミット
      - name: clients.jsonとドキュメントをGitにコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clients.json README.md CLAUDE.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Auto-update clients.json from daily sync [skip ci]"
          git push

      # Step 13.5: Kintone同期の失敗を検知してジョブを失敗させる
      #   デプロイ・コミットは完了済み（良いデータは反映される）。
      #   ここでジョブを赤くすることで GitHub の失敗メール＋Step15の失敗通知を発火させる。
      - name: Kintone同期の失敗を検知
        if: always() && steps.kintone.outcome == 'failure'
        run: |
          echo "::error::Kintoneデータ取得に失敗しました（APIトークン等を確認してください）。入退院(184)/入退去(197)の取込が不完全な可能性があります。"
          echo "失敗ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1

      # Step 14: デプロイ結果を通知
      - name: デプロイ結果サマリー
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ デプロイ成功"
            echo "🌐 URL: https://welfare-assist-pro.web.app"
            echo "📊 スプレッドシート + Kintone: データ更新完了"
          else
            echo "❌ デプロイ失敗"
          fi

      # Step 15: 失敗時の通知（オプション）
      - name: 失敗通知
        if: failure()
        run: |
          echo "::error::データ同期またはデプロイに失敗しました"
          echo "ログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
