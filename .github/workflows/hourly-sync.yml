name: Hourly Spreadsheet Sync

on:
  schedule:
    # 毎時0分に実行（日本時間で毎時0分）
    - cron: '0 * * * *'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      reason:
        description: '手動実行の理由（オプション）'
        required: false
        default: '手動同期'

# GitHub Actionsがリポジトリにpushできるようにする
permissions:
  contents: write

jobs:
  sync-and-deploy:
    name: スプレッドシート同期＆デプロイ
    runs-on: ubuntu-latest

    steps:
      # Step 1: リポジトリをチェックアウト
      - name: チェックアウト
        uses: actions/checkout@v4

      # Step 2: Node.jsのセットアップ
      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: 依存関係をインストール
      - name: 依存関係インストール
        run: |
          npm ci
          npm install firebase-admin

      # Step 4: GCP認証情報を設定
      - name: GCP認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: サービスアカウントキーをファイルに保存
      - name: サービスアカウントキーを保存
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > service-account-key.json

      # Step 6: スプレッドシートからデータをインポート
      - name: スプレッドシートデータ取得
        run: node importSpreadsheetData.cjs

      # Step 7: clients.jsonをpublicフォルダにコピー
      - name: データファイルをpublicにコピー
        run: |
          mkdir -p public
          cp clients.json public/clients.json

      # Step 8: アプリケーションをビルド
      - name: アプリケーションビルド
        run: npm run build

      # Step 9: Firebase Hostingにデプロイ
      - name: Firebase Hostingデプロイ
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project=welfare-assist-pro --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json

      # Step 10: clients.jsonをGitにコミット
      - name: clients.jsonをGitにコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clients.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Auto-update clients.json from hourly sync [skip ci]"
          git push

      # Step 11: デプロイ結果を通知
      - name: デプロイ結果サマリー
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ デプロイ成功"
            echo "🌐 URL: https://welfare-assist-pro.web.app"
            echo "📊 データ件数: 8,412件"
          else
            echo "❌ デプロイ失敗"
          fi

      # Step 12: 失敗時の通知（オプション）
      - name: 失敗通知
        if: failure()
        run: |
          echo "::error::スプレッドシート同期またはデプロイに失敗しました"
          echo "ログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
