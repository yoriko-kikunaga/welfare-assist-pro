name: Daily Kintone Sync

on:
  schedule:
    # 毎日24時（JST）= 15時（UTC）に実行
    - cron: '0 15 * * *'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      reason:
        description: '手動実行の理由（オプション）'
        required: false
        default: '手動同期'

# GitHub Actionsがリポジトリにpushできるようにする
permissions:
  contents: write

jobs:
  kintone-sync-and-deploy:
    name: kintone同期＆デプロイ
    runs-on: ubuntu-latest

    steps:
      # Step 1: リポジトリをチェックアウト
      - name: チェックアウト
        uses: actions/checkout@v4

      # Step 2: Node.jsのセットアップ
      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: 依存関係をインストール
      - name: 依存関係インストール
        run: |
          npm ci
          npm install firebase-admin

      # Step 4: GCP認証情報を設定
      - name: GCP認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: サービスアカウントキーをファイルに保存
      - name: サービスアカウントキーを保存
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > service-account-key.json

      # Step 6: スプレッドシートからベースデータをインポート
      - name: スプレッドシートデータ取得
        run: node importSpreadsheetData.cjs

      # Step 7: .envファイルを作成（kintone APIトークン）
      - name: kintone環境変数設定
        run: |
          cat << EOF > .env
          KINTONE_SUBDOMAIN=acgaozora
          KINTONE_API_TOKEN_184=${{ secrets.KINTONE_API_TOKEN_184 }}
          KINTONE_API_TOKEN_197=${{ secrets.KINTONE_API_TOKEN_197 }}
          EOF

      # Step 8: kintoneからデータをインポート
      - name: kintoneデータ取得
        run: node importFromKintone.cjs

      # Step 9: clients.jsonをpublic/assetsフォルダにコピー
      - name: データファイルをpublic/assetsにコピー
        run: |
          mkdir -p public/assets
          cp clients.json public/assets/clients.json

      # Step 10: アプリケーションをビルド
      - name: アプリケーションビルド
        run: npm run build

      # Step 11: Firebase Hostingにデプロイ
      - name: Firebase Hostingデプロイ
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project=welfare-assist-pro --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json

      # Step 12: clients.jsonをGitにコミット
      - name: clients.jsonをGitにコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clients.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Auto-update clients.json from daily kintone sync [skip ci]"
          git push

      # Step 13: デプロイ結果を通知
      - name: デプロイ結果サマリー
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ デプロイ成功"
            echo "🌐 URL: https://welfare-assist-pro.web.app"
            echo "📊 スプレッドシート: 8,412件"
            echo "📊 kintone: 959件の変更レコード"
          else
            echo "❌ デプロイ失敗"
          fi

      # Step 14: 失敗時の通知（オプション）
      - name: 失敗通知
        if: failure()
        run: |
          echo "::error::kintone同期またはデプロイに失敗しました"
          echo "ログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
